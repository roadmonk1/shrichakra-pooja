  <polygon points="32,54 50,18 14,18" stroke="url(#gold)" stroke-width="1.2" fill="none" filter="url(#glow)" />
  <polygon points="32,16 45,42 19,42" stroke="url(#gold)" stroke-width="1" fill="none" opacity="0.8" />
  <polygon points="32,48 45,22 19,22" stroke="url(#gold)" stroke-width="1" fill="none" opacity="0.8" />
  <circle cx="32" cy="32" r="2" fill="#fff5c0" filter="url(#glow)" />
